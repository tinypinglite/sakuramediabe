[project]
name = "sakuramediabe"
version = "0.1.0"
description = ""
authors = [{ name = "tinypinglite", email = "tinyping@proton.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn>=0.22.0,<0.23.0",
    "loguru>=0.7.0,<0.8.0",
    "python-jose>=3.3.0,<4.0.0",
    "peewee>=3.16.2,<4.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "qbittorrent-api>=2026.5.0",
    "xmltodict>=0.13.0,<0.14.0",
    "libtorrent>=2.0.9,<3.0.0",
    "python-multipart>=0.0.6,<0.0.7",
    "bcrypt>=4.0.1,<5.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    # 下限压到 14.2 是为了给 Intel macOS 开发机留出可解版本（见 [tool.uv] 的按平台约束）；
    # linux / arm64 仍会解析到 15.x。代码只用到 av.open / av.time_base，两个大版本行为一致。
    "av>=14.2.0,<16.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "pillow==10.4.0",
    "opencv-python-headless==4.10.0.84",
    "toml>=0.10.2,<0.11.0",
    # Python 3.10 下 pydantic-settings 读取 TOML 需要 tomli，避免 Docker 运行时缺依赖。
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "qdrant-client>=1.12,<1.13",
    "numpy>=1.26,<3",
    "pycurl>=7.47,<8",
    "certifi>=2026.4.22",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-testmon>=2.1.0,<3.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pylint>=3.3.7,<4.0.0",
]

[tool.pytest.ini_options]
# 默认开 6 个 xdist worker + testmon 增量：
#   -n 6      与本机物理核心数匹配，避免每个 worker 独立建库时过度并发 PostgreSQL
#   --testmon pytest-testmon 只跑受改动影响的用例（.testmondata 本地缓存，已 gitignore）
# 日常开发改一个文件通常只跑几秒；首次运行会跑全集建 baseline（~90s）。
# 想跑全量做验收/对比：uv run pytest --no-testmon
# 调试单个用例（-s / pdb / 断点）：uv run pytest -n0 --no-testmon path::case
addopts = "-n 6 --testmon"
testpaths = ["tests"]
# pytest-asyncio auto 模式：所有 async def test_* 自动按协程执行，免逐个 @pytest.mark.asyncio。
asyncio_mode = "auto"
markers = [
    "cloud115_integration: hits real 115 API using COOKIE_115 env var; skip by default",
]

[tool.uv]
# 轮子可用性约束，全部按平台加 marker，避免为了照顾某台开发机把生产解析一起降下去。
#
# libtorrent：2.0.12+ 不再发 macOS 13 Intel 轮子，故全局钉在 <2.0.12（与 main 锁一致）；
#   而 2.0.11 的 macOS Intel 轮子要求 macOS >= 13，macOS 12 Intel 机器上无解，再单独降到 2.0.9
#   （最后一个发 macosx_10_9_x86_64 轮子的版本）。这条不能做成全局降版：2.0.9 没有 macOS arm64
#   轮子，全局降会让 Apple Silicon 开发机退化成源码编译。
# av：15.x 的 macOS 轮子要求 macOS >= 13，14.2.0 是最后一个发 macosx_12_0 轮子的版本；
#   14.3 / 14.4 干脆没发 cp310 轮子（会退化成源码编译 ffmpeg），所以上界取 <14.3 而不是 <15。
#   同样只降 macOS 12 Intel 这一个环境，linux / arm64 保持 15.x。
constraint-dependencies = [
    "libtorrent<2.0.12",
    "libtorrent<2.0.10; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "av<14.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
