[project]
name = "sakuramediabe"
version = "0.1.0"
description = ""
authors = [{ name = "tinypinglite", email = "tinyping@proton.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn>=0.22.0,<0.23.0",
    "loguru>=0.7.0,<0.8.0",
    "python-jose>=3.3.0,<4.0.0",
    "passlib>=1.7.4,<2.0.0",
    "peewee>=3.16.2,<4.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "qbittorrent-api>=2023.6.49,<2024.0.0",
    "xmltodict>=0.13.0,<0.14.0",
    "libtorrent>=2.0.9,<3.0.0",
    "ffmpy>=0.3.0,<0.4.0",
    "python-multipart>=0.0.6,<0.0.7",
    "bcrypt>=4.0.1,<5.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "av>=15.0.0,<16.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "pillow==10.4.0",
    "opencv-python-headless==4.10.0.84",
    "toml>=0.10.2,<0.11.0",
    # Python 3.10 下 pydantic-settings 读取 TOML 需要 tomli，避免 Docker 运行时缺依赖。
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "lancedb>=0.21.2,<0.22.0",
    "pyarrow>=16.1.0,<17.0.0",
    # onnxruntime 1.24+ 不再发布 cp310 wheel（上游 metadata Requires-Python 与实际发布不一致）。
    "onnxruntime<1.24",
    "pymysql>=1.1.2,<2.0.0",
    "numpy>=1.26,<3",
    "curl-cffi>=0.15.0,<0.16.0",
    "sakuramedia-metadata-providers",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pylint>=3.3.7,<4.0.0",
]

[tool.uv]
# 限制 uv 求解的目标环境，与 lib/metadata-provider 下提供的本地 wheel 平台一一对应。
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
sakuramedia-metadata-providers = [
    { path = "lib/metadata-provider/sakuramedia_metadata_providers-0.1.7-cp310-cp310-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { path = "lib/metadata-provider/sakuramedia_metadata_providers-0.1.7-cp310-cp310-macosx_10_15_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { path = "lib/metadata-provider/sakuramedia_metadata_providers-0.1.7-cp310-cp310-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { path = "lib/metadata-provider/sakuramedia_metadata_providers-0.1.7-cp310-cp310-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
