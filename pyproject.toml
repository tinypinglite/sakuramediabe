[project]
name = "sakuramediabe"
version = "0.1.0"
description = ""
authors = [{ name = "tinypinglite", email = "tinyping@proton.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn>=0.22.0,<0.23.0",
    "loguru>=0.7.0,<0.8.0",
    "python-jose>=3.3.0,<4.0.0",
    "passlib>=1.7.4,<2.0.0",
    "peewee>=3.16.2,<4.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "qbittorrent-api>=2026.5.0",
    "xmltodict>=0.13.0,<0.14.0",
    "libtorrent>=2.0.9,<3.0.0",
    "ffmpy>=0.3.0,<0.4.0",
    "python-multipart>=0.0.6,<0.0.7",
    "bcrypt>=4.0.1,<5.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    "av>=15.0.0,<16.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "pillow==10.4.0",
    "opencv-python-headless==4.10.0.84",
    "toml>=0.10.2,<0.11.0",
    # Python 3.10 下 pydantic-settings 读取 TOML 需要 tomli，避免 Docker 运行时缺依赖。
    "tomli>=2.0.1,<3.0.0; python_version < '3.11'",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "qdrant-client>=1.12,<1.13",
    "pymysql>=1.1.2,<2.0.0",
    "numpy>=1.26,<3",
    "curl-cffi>=0.15.0,<0.16.0",
    "lxml>=6.1.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-testmon>=2.1.0,<3.0.0",
    "pylint>=3.3.7,<4.0.0",
]

[tool.pytest.ini_options]
# 默认用 pytest-xdist 多进程并行（auto = 按 CPU 核数）。全量约 6× 提速。
# 调试单个用例需要 -s / pdb / 断点时，用 `-n0` 关闭并行：uv run pytest -n0 path::case
addopts = "-n auto"
testpaths = ["tests"]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
