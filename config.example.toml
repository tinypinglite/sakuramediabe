# 是否启 Swagger / ReDoc 文档页面，建议不要开启
enable_docs = false

[database]
# 数据库类型固定为 postgres。
engine = "postgres"

# PostgreSQL 连接串。默认值与 compose.example.yaml 内置的 postgres 服务对齐，
# 照抄 compose 部署时无需修改；只有使用外部 PostgreSQL 时才需要改这里。
url = "postgresql://sakuramedia:sakuramedia@postgres:5432/sakuramedia"

[auth]

# 建议之后用 app 修改这个配置项，修改后会覆盖掉 config.toml 中的配置
# 默认登录用户名。
username = "account"
# 默认登录密码。
password = "account"


# JWT 签名密钥。留空即可：首次启动会自动生成随机密钥并写回本配置文件，之后保持不变。
# 如需自定义，可填一个长度不少于 32 字符的随机字符串。
secret_key = ""


[media]
# 合集影片时长阈值，单位：分钟；仅当影片时长严格大于该值时，才会按时长规则判定为合集。
collection_duration_threshold_minutes = 300
# 允许导入的视频最小文件大小，单位：字节；设为 0 表示不限制。建议设置为1GB即1024*1024*1024。
allowed_min_video_file_size = 1073741824
# 字幕文件存储目录（历史抓取字幕与本地字幕索引解析都会使用）。
subtitle_root_path = "/data/cache/subtitles"
# 用户片段（ffmpeg 切出的独立 mp4）的存储目录。建议作为独立 docker 卷映射到本地持久化，
# 目录需被容器运行用户可写。片段与来源媒体解耦，删除媒体不会删除片段文件。
media_clip_root_path = "/data/media-clips"
# 用户可圈选的片段最大时长（秒），仅约束圈选区间长度，不等于 ffmpeg 进程耗时。
media_clip_max_duration_seconds = 900
# 单次 ffmpeg 切片的墙钟超时（秒），兜住坏文件/慢挂载导致的进程卡死，超时即杀进程回收。
media_clip_ffmpeg_timeout_seconds = 120

[scheduler]
# 影片互动数同步 cron 表达式。
movie_interaction_sync_cron = "0 5 * * *"
# 影片描述回填 cron 表达式。
movie_desc_sync_cron = "0 4 * * *"
# 影片简介翻译 cron 表达式。
movie_desc_translation_cron = "15 4 * * *"
# 影片相似度重算 cron 表达式。
movie_similarity_recompute_cron = "30 3 * * *"
# 推荐时刻生成 cron 表达式。
moment_recommendation_generate_cron = "0 4 * * *"
# 每日推荐快照生成 cron 表达式。
daily_recommendation_generate_cron = "0 5 * * *"
# 下载中种子小文件清理 cron 表达式。
download_small_file_cleanup_cron = "*/5 * * * *"

[downloads]
# 下载中种子内小于该大小（MB）的文件视为可清理小文件，会被设为不下载并物理删除。
small_file_cleanup_threshold_mb = 256

[media_import]
# 可视化导入只允许浏览/导入这些白名单根目录（含其子树），其余路径一律返回 403。
browse_roots = ["/mnt"]

[movie_info_translation]
# 是否启用影片信息翻译任务（简介翻译、标题翻译共用）。
enabled = false
# OpenAI 兼容服务地址。
base_url = "http://localhost:8000"
# OpenAI 兼容服务 API Key；未启用时可留空。
api_key = ""
# 翻译使用的模型名称。
model = "gpt-4o-mini"
# 翻译请求总超时秒数。
timeout_seconds = 120
# 翻译请求建连超时秒数。
connect_timeout_seconds = 3

[metadata]
# DMM、MissAV 与 GFriends 共用的代理地址；JavDB 默认直连。不需要代理时留空。
# 仅支持 http 代理：例如 http://192.168.1.1:7890
proxy = ""

[image_search]
# JoyTag 独立推理服务地址。
inference_base_url = "http://joytag-infer:8001"
# 请求超时秒数。
inference_timeout_seconds = 30
# 建连超时秒数。
inference_connect_timeout_seconds = 3
# 推理服务鉴权 token；未启用时留空。
inference_api_key = ""

[qdrant]
# Qdrant 服务地址；compose 部署默认使用内部服务名 qdrant。
url = "http://qdrant:6333"
# Qdrant API Key；未启用鉴权时留空。
api_key = ""
