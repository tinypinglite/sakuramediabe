[supervisord]
logfile=/data/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/data/logs
nodaemon=true
user=root

[inet_http_server]
port=*:9001

; supervisorctl 与「立即生效」接口都走这个 XML-RPC 命名空间；缺了它 9001 只是只读状态页。
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001

[program:api]
directory=/app
command=uvicorn src.api.app:app --workers 1 --host 0.0.0.0 --port 8000 --log-config /app/src/api/uvicorn_config.json
autostart=true
autorestart=true
; stderr 合并进 stdout，避免两套轮转逻辑切割同一个文件互相覆盖。
redirect_stderr=true
stdout_logfile=/data/logs/api.log
; maxbytes 控制单文件大小上限，backups 控制保留的滚动份数；置 0 会关闭轮转导致日志无限增长。
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
killasgroup=true
stopasgroup=true
user=app
environment=PYTHONPATH=/app


[program:aps]
directory=/app
command=python /app/cli.py aps
autostart=true
autorestart=true
; stderr 合并进 stdout，避免两套轮转逻辑切割同一个文件互相覆盖。
redirect_stderr=true
stdout_logfile=/data/logs/aps.log
; maxbytes 控制单文件大小上限，backups 控制保留的滚动份数；置 0 会关闭轮转导致日志无限增长。
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
killasgroup=true
user=app
stopasgroup=true
environment=PYTHONPATH=/app


; 一次性重启程序：由「立即生效」接口通过 XML-RPC 拉起，停启 api/aps 后自行退出。
; 它独立于 api 进程，所以 API 被自己触发重启时也不会中断重启流程。
[program:apply-restart]
command=/bin/sh -c "sleep 2; supervisorctl -c /etc/supervisor/supervisord.conf restart api aps"
autostart=false
autorestart=false
; 脚本启动后立即算启动成功，避免 startsecs 的默认 1 秒把快速退出当成 FATAL。
startsecs=0
redirect_stderr=true
stdout_logfile=/data/logs/apply-restart.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
user=app
